# Requires repo Actions secrets (set by Jerry; values are not in git):
#   CLOUDFLARE_API_TOKEN  — API token with Workers edit (e.g. "Edit Cloudflare Workers")
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account ID for worker jerrykhh-profile
# Optional: create GitHub Environments named `production` (main) and `development`.
on:
  push:
    branches:
      - main
      - development

name: release-and-deploy

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Manifest mode: release-please-config.json + .release-please-manifest.json
      # pin last released version at 4.0.0 (tag v4.0.0 exists; GitHub Releases still
      # only list through v3.0.1, which caused a bogus 3.1.0 release PR).
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}

  deploy:
    needs: release-please
    # development: release-please is skipped → deploy
    # main: deploy only when release-please created a GitHub release
    if: >-
      always() &&
      (needs.release-please.result == 'skipped' ||
       needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Gate-first: typecheck + vitest before deploy. Playwright E2E intentionally omitted
      # (over-engineering for this surface — see tests/README.md).
      - run: npm run typecheck
      - run: npm test
      # vinext + cloudflare.config.ts deploys via `cf` (`npm run deploy`), not wrangler.toml.
      # wrangler-action injects CLOUDFLARE_* for preCommands; whoami avoids a bare wrangler deploy.
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          preCommands: npm run deploy
          command: whoami
